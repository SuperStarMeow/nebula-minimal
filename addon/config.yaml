name: "Nebula Minimal"
description: "a Nebula VPN Home Assistant app with minimalism in mind"
version: "0.1.0"
slug: "nebula-minimal"
init:
boot: "auto"
map:
  - addon_config:rw
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
host_network: true
privileged:
  - NET_ADMIN
options:
  nebula_version: "latest"
schema:
  nebula_version: "list(latest|1.11.2|1.11.1|1.11.0|1.10.3|1.10.2|1.10.1|1.10.0|1.9.7|1.9.6|1.9.5|1.9.4|1.9.3|1.9.2|1.9.1|1.9.0|1.8.2|1.8.1|1.8.0|1.7.2|1.7.1|1.7.0|1.6.1|1.6.0|1.5.2|1.5.0|1.4.0|1.3.0|1.2.0|1.1.0)"
