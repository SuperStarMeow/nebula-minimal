name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell scripts and Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck addon/run.sh addon/scripts/*.sh tests/*.sh
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint - < addon/Dockerfile

  test:
    name: Test version resolution and configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run tests
        run: ./tests/run.sh

  build:
    name: Build the app image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build add-on image
        run: |
          docker build \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.22 \
            --tag nebula-minimal:ci \
            addon
      - name: Verify the bundled Nebula version
        run: |
          expected="$(sed -n 's/^ARG NEBULA_VERSION=//p' addon/Dockerfile)"
          actual="$(docker run --rm --entrypoint nebula nebula-minimal:ci -version | sed -n 's/^Version: //p')"
          echo "expected ${expected}, got ${actual}"
          test "${expected}" = "${actual}"
      - name: Verify the runtime download of another version
        run: |
          docker run --rm -e NEBULA_CACHE_DIR=/tmp/nebula --entrypoint sh nebula-minimal:ci -c '
            set -e
            bin="$(select-nebula.sh 1.10.3)"
            test "${bin}" = "/tmp/nebula/1.10.3/nebula"
            "${bin}" -version | grep -qx "Version: 1.10.3"
            select-nebula.sh latest | grep -qx "/usr/local/bin/nebula"
          '
